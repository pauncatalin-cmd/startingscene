<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080">
  <title>KIP ZONE — Pauză · Chat 1080×1920</title>
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <div id="scene" class="vertical">
    <div class="backdrop"></div>
    <div class="grid"></div>
    <div class="beam cyan"></div>
    <div class="beam orange"></div>
    <div class="edge"></div>

    <header>
      <div class="brand">KIP<span>ZONE</span>.RO<small>GAMING &amp; COMMUNITY</small></div>
      <div class="headline">
        <div class="eyebrow"><span class="dot"></span>CHAT TIME</div>
        <h1>PAUZĂ · <em>REVIN IMEDIAT</em></h1>
      </div>
    </header>

    <!-- OBS Vertical: place source "Camera " here. Inner cutout 940×528 at 70,200 -->
    <div class="frame cam-frame" data-obs-source="Camera " data-obs-rect="70,200,940,528">
      <span class="label">CAMERA</span>
    </div>

    <!-- OBS Vertical: place TikStage Chat browser source here. Inner cutout 940×430 at 70,754 -->
    <div class="frame chat-frame" data-obs-source="Web - Chat TikStage" data-obs-rect="70,754,940,430">
      <span class="label">CHAT TIKTOK</span>
    </div>

    <div class="socials">
      <div class="social kick">
        <img src="https://pauncatalin-cmd.github.io/overlay-live/assets/kick.svg" alt="">
        <div><small>KICK</small><strong>kipzone</strong></div>
      </div>
      <div class="social">
        <img src="https://pauncatalin-cmd.github.io/overlay-live/assets/youtube.svg" alt="">
        <div><small>YOUTUBE</small><strong>@kipanu</strong></div>
      </div>
      <div class="social">
        <img src="https://pauncatalin-cmd.github.io/overlay-live/assets/tiktok.svg" alt="">
        <div><small>TIKTOK</small><strong>@kipzone.ro</strong></div>
      </div>
    </div>

    <footer>KIPZONE.RO <span>↗</span></footer>
  </div>
  <script>
    (function () {
      const scene = document.getElementById('scene');
      function fit() {
        const s = Math.min(innerWidth / 1080, innerHeight / 1920);
        scene.style.transform = 'translate(' + ((innerWidth - 1080 * s) / 2) + 'px,' + ((innerHeight - 1920 * s) / 2) + 'px) scale(' + s + ')';
      }
      fit();
      addEventListener('resize', fit);
    })();
  </script>
</body>
</html>
